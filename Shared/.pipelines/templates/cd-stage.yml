# CD template
parameters:
  - name: env
    type: string
    default: 'dev'
  - name: ciPipeline
    type: string

jobs:
- deployment: DeployADF
  displayName: "Deploy ARM Template to Data Factory in ${{ parameters.env }}"
  pool:
    name: UCareLZAltProvAgentPool 
  environment: ${{ parameters.env }} 
  variables:
  - template: ../variables/${{ parameters.env }}.yml
  strategy:
    runOnce:
      deploy:
        steps:
        - checkout: self
          displayName: 'Checkout CD pipeline repo'

        - task: DownloadPipelineArtifact@2
          inputs:
            buildType: 'specific'
            project: 'ETLOperations'
            pipeline: '${{ parameters.ciPipeline }}'
            runVersion: 'latest'
            artifactName: 'adf-artifact-ArmTemplate'
            targetPath: '$(Pipeline.Workspace)/adf-deployment-artifact'
          displayName: 'Download ARM Template Artifact'
      
        - script: dir
          displayName: List files in Workspace
          workingDirectory: '$(Pipeline.Workspace)/adf-deployment-artifact'

        # Deploy ADF resources to Live Mode
        - task: AzureResourceManagerTemplateDeployment@3
          displayName: 'Deploying ARM Template to Data Factory'
          inputs:
            deploymentScope: 'Resource Group'
            azureResourceManagerConnection: ${{ variables['serviceConnection'] }}
            subscriptionId: ${{ variables['subscriptionId'] }} 
            action: 'Create Or Update Resource Group'
            resourceGroupName: ${{ variables['resourceGroupName'] }}  
            location: 'Central US'
            templateLocation: 'Linked artifact'
            csmFile: '$(Pipeline.Workspace)/adf-deployment-artifact/ARMTemplateForFactory.json'
            csmParametersFile: '$(Pipeline.Workspace)/adf-deployment-artifact/ARMTemplateParametersForFactory.json'
            overrideParameters: >
              -factoryName "$(dataFactoryName)"
              -LS_SQL_DL_OUTBOUND_properties_typeProperties_server "$(LS_SQL_DL_OUTBOUND_properties_typeProperties_server)"
              -LS_SQL_DL_OUTBOUND_properties_typeProperties_database "$(LS_SQL_DL_OUTBOUND_properties_typeProperties_database)"
              -LS_SQL_DL_OUTBOUND_properties_typeProperties_userName "$(LS_SQL_DL_OUTBOUND_properties_typeProperties_userName)"
              -LS_SQL_EXP_properties_typeProperties_server "$(LS_SQL_EXP_properties_typeProperties_server)"
              -LS_SQL_EXP_properties_typeProperties_database "$(LS_SQL_EXP_properties_typeProperties_database)"
              -LS_SQL_EXP_properties_typeProperties_userName "$(LS_SQL_EXP_properties_typeProperties_userName)"
              -LS_AzureSqlMI_OMA_properties_typeProperties_server "$(LS_AzureSqlMI_OMA_properties_typeProperties_server)"
              -LS_AzureSqlMI_OMA_properties_typeProperties_database "$(LS_AzureSqlMI_OMA_properties_typeProperties_database)"
              -LS_AKV_ETLShared_properties_typeProperties_baseUrl "$(LS_AKV_ETLShared_properties_typeProperties_baseUrl)"
              -UCM-ADF-PORTALSQLMI-MPE_properties_privateLinkResourceId "$(UCM-ADF-PORTALSQLMI-MPE_properties_privateLinkResourceId)"
              -UCM-ADF-PORTALSQLMI-MPE_properties_groupId "$(UCM-ADF-PORTALSQLMI-MPE_properties_groupId)"
              -LS_SQL_AZUREINEGRATION_properties_typeProperties_server "$(LS_SQL_AZUREINEGRATION_properties_typeProperties_server)"
              -LS_SQL_AZUREINEGRATION_properties_typeProperties_database "$(LS_SQL_AZUREINEGRATION_properties_typeProperties_database)"
              -LS_SQL_AZUREINEGRATION_properties_typeProperties_userName "$(LS_SQL_AZUREINEGRATION_properties_typeProperties_userName)"
              -LS_ALTPROV_ADLS_properties_typeProperties_url "$(LS_ALTPROV_ADLS_properties_typeProperties_url)"
              -LS_CRM_D365_properties_typeProperties_serviceUri "$(LS_CRM_D365_properties_typeProperties_serviceUri)"
              -LS_CRM_D365_properties_typeProperties_servicePrincipalId "$(LS_CRM_D365_properties_typeProperties_servicePrincipalId)"
            deploymentMode: 'Incremental'

        # Post-deployment verification (optional)
        - task: AzureCLI@2
          inputs:
            azureSubscription: ${{ variables['serviceConnection'] }} 
            scriptType: 'bash'
            scriptLocation: 'inlineScript'
            inlineScript: |
              # Verify the Data Factory deployment
              RESOURCE_GROUP="$(resourceGroupName)"
              DATAFACTORY_NAME="$(dataFactoryName)"
              echo "Validating deployment of Data Factory: $DATAFACTORY_NAME in Resource Group: $RESOURCE_GROUP"
            
              # Check if the Data Factory exists
              az extension add --name datafactory
              az datafactory show --resource-group $RESOURCE_GROUP --factory-name $DATAFACTORY_NAME
          displayName: 'Verify Data Factory Deployment'
          condition: succeeded()